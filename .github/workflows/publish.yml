name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets npm exchange a GitHub identity token for publish rights, so no
      # npm token has to live in this repository. Also what signs provenance.
      id-token: write

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag but package.json says $version." >&2
            exit 1
          fi

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public --provenance
